name: Ingest website image

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - "tmp/image-upload/**"

permissions:
  contents: write
  pull-requests: read

jobs:
  ingest:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Decode image and update website pages
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          from pathlib import Path

          repo = Path.cwd()
          upload_dir = repo / "tmp" / "image-upload"
          stem = "liftx-modern-black-garage-door-boise.jpg.b64"
          parts = sorted(upload_dir.glob(stem + ".part*"))

          if parts:
              payload = "".join(p.read_text(encoding="utf-8") for p in parts)
          else:
              single = upload_dir / stem
              if not single.exists():
                  raise SystemExit("No image payload found")
              payload = single.read_text(encoding="utf-8")

          image_name = "liftx-modern-black-garage-door-boise.jpg"
          image_path = repo / image_name
          image_path.write_bytes(base64.b64decode(payload, validate=True))

          replacements = {
              "residential.html": (
                  '<img src="residential.jpg" alt="Residential Garage Door Service & Installation" loading="lazy">',
                  '<img src="liftx-modern-black-garage-door-boise.jpg" alt="Modern black residential garage door with offset frosted-glass windows installed by LIFTX" width="800" height="1067" loading="lazy" decoding="async">',
              ),
              "garage-door-installation-boise.html": (
                  '<img src="fullview-project.jpg" alt="Garage Door Installation & Replacement" loading="lazy">',
                  '<img src="liftx-modern-black-garage-door-boise.jpg" alt="Modern black garage door installation with offset frosted-glass windows" width="800" height="1067" loading="lazy" decoding="async">',
              ),
              "projects.html": (
                  '<article class="project-card"><img src="residential.jpg" alt="Residential garage door project"><div><small>Residential</small><h3>Residential Door Installation</h3></div></article>',
                  '<article class="project-card"><img src="liftx-modern-black-garage-door-boise.jpg" alt="Modern black residential garage door with offset frosted-glass windows" width="800" height="1067" loading="lazy" decoding="async"><div><small>Residential</small><h3>Modern Black Door Installation</h3></div></article>',
              ),
          }

          for filename, (old, new) in replacements.items():
              path = repo / filename
              text = path.read_text(encoding="utf-8")
              if new in text:
                  continue
              if old not in text:
                  raise SystemExit(f"Expected markup not found in {filename}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          for p in parts:
              p.unlink()
          (upload_dir / stem).unlink(missing_ok=True)
          if upload_dir.exists() and not any(upload_dir.iterdir()):
              upload_dir.rmdir()
              parent = upload_dir.parent
              if parent.exists() and not any(parent.iterdir()):
                  parent.rmdir()

          print(f"Added {image_name}")
          print("Updated residential.html, projects.html, and garage-door-installation-boise.html")
          PY

      - name: Commit generated JPG and page updates
        shell: bash
        run: |
          git config user.name "LIFTX Website Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add modern black garage door photo across site"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
