name: Build Garaga Web Asset Archive

on:
  pull_request:
    branches:
      - main
    paths:
      - garaga-download-request.txt

permissions:
  contents: read

jobs:
  crawl-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install crawler dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Crawl and package Garaga web assets
        run: python .github/scripts/download_garaga_assets_v3.py

      - name: Upload Garaga archive
        uses: actions/upload-artifact@v4
        with:
          name: garaga-digital-assets-web
          path: output/Garaga_Digital_Assets_Web.zip
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
